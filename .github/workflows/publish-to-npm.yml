name: Publish to npmjs
on:
  release:
    types: [published]
permissions:
  id-token: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # The tests are timezone sensitive - 50 of them fail under UTC. Node reads
    # TZ directly, so this replaces the szenius/set-timezone action, which is
    # still built on the deprecated Node 20 runtime.
    env:
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          
      - run: npm ci
      - run: "npm run test"
      
      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
