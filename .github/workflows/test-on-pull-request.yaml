name: Run tests on pull request
on: pull_request
jobs:
  build_and_test:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: ubuntu-latest
    # The tests are timezone sensitive - 50 of them fail under UTC. Node reads
    # TZ directly, so this replaces the szenius/set-timezone action, which is
    # still built on the deprecated Node 20 runtime.
    env:
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - run: npm ci
      - run: "npm run test"
